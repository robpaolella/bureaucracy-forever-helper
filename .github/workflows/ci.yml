# Runs the repo's Checks (AGENTS.md) and builds unsigned installers as artifacts.
# Read-only and secret-free, so it is safe for pull requests from forks.
# It never publishes a release or pushes tags; release drafts are made by release.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Tauri system libraries from AGENTS.md's Run locally section.
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            lua5.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The same commands as AGENTS.md's Checks section, one step each so a failure is easy to spot.
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Front-end tests
        run: npm test
      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rust lint (clippy)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      # The inbox test skips itself (and passes) when lua5.1 is missing. In CI a skip must fail.
      - name: Inbox file loads in Lua 5.1 (must not skip)
        working-directory: src-tauri
        run: |
          command -v lua5.1
          cargo test output_loads_in_lua_5_1_as_the_same_data -- --nocapture 2>&1 | tee "$RUNNER_TEMP/lua-test.log"
          if grep -q SKIPPED "$RUNNER_TEMP/lua-test.log"; then
            echo "::error::The Lua 5.1 test was skipped"
            exit 1
          fi
          grep -q "1 passed" "$RUNNER_TEMP/lua-test.log"

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macos-intel
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # Unsigned: no signing identity or certificate is configured, and no secrets are used.
      - name: Build installer
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bureaucracy-forever-helper-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
