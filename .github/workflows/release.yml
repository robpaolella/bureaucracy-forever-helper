# After each merge to main that calls for a release: builds the signed installers and update
# files, and creates or refreshes the one draft release for the next version (release/draft.ts).
# Robert publishes it on GitHub; nothing here publishes a release or pushes a tag.
# Only the signed build step sees the update-signing key, in jobs with a read-only token; only
# the draft job can write, and it never sees the key or runs build code. Pull requests never run
# this workflow (their unsigned build is in ci.yml).
name: Release

on:
  push:
    branches: [main]

permissions: {}

# One run at a time and none cancelled half-way, so two quick merges can't make two drafts.
# A run still waiting is replaced by a newer one, which covers both merges.
concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The next version and notes from the PRs merged since the last published release (#16).
      - id: check
        run: |
          node release/cli.ts "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/plan.txt"
          node release/draft.ts check "$GITHUB_REPOSITORY" "$RUNNER_TEMP/plan.txt"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Build (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos-apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macos-intel
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # The version is stamped in here, never committed. The Tauri CLI's own bundler signs the
      # update files, which records the version in each signature; the updater requires it.
      # createUpdaterArtifacts is switched on here only: tauri.conf.json and ci.yml leave it off.
      - name: Build signed installer and update files
        shell: bash
        run: |
          config="{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
          npm run tauri build -- --ci --target "${{ matrix.target }}" --config "$config"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Names every file bureaucracy-forever-helper_<version>_<platform>, the names
      # release/manifest.ts expects. Each pattern must match exactly one file.
      - name: Name the release files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          out="$RUNNER_TEMP/release"
          base="bureaucracy-forever-helper_${VERSION}_${{ matrix.name }}"
          mkdir -p "$out"
          take() {
            local found=($1)
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::Expected one file matching $1, found ${#found[@]}"
              exit 1
            fi
            mv "${found[0]}" "$out/$2"
          }
          case "${{ matrix.name }}" in
            macos-*)
              take "$bundle/dmg/*.dmg" "$base.dmg"
              take "$bundle/macos/*.app.tar.gz" "$base.app.tar.gz"
              take "$bundle/macos/*.app.tar.gz.sig" "$base.app.tar.gz.sig"
              ;;
            windows-*)
              take "$bundle/nsis/*-setup.exe" "$base-setup.exe"
              take "$bundle/nsis/*-setup.exe.sig" "$base-setup.exe.sig"
              take "$bundle/msi/*.msi" "$base.msi"
              take "$bundle/msi/*.msi.sig" "$base.msi.sig"
              ;;
          esac
          ls -l "$out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can write: it makes the draft. No signing key, no npm install or build.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release

      - name: Create or refresh the draft
        run: |
          printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.md"
          node release/manifest.ts "$GITHUB_REPOSITORY" "$VERSION" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release"
          node release/draft.ts create "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$VERSION" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          NOTES: ${{ needs.plan.outputs.notes }}
