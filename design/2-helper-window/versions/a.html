<style>/* Tokens: the guild site's app/tokens.css (dark only). */
:root {
  --ink-950:#06080B; --ink-900:#0A0D12; --ink-850:#0E1219; --ink-800:#141922; --ink-700:#1B222E;
  --line:#232B38; --line-strong:#323C4C; --line-faint:#141922;
  --fg:#E8EDF7; --fg-2:#A3AFC2; --fg-3:#6F7C90; --fg-muted:#8D97A8;
  --sand:#E4C08A; --sand-dim:#8A7350; --sand-wash:#241E14;
  --teal:#6FC8DC; --teal-dim:#2A6B7C; --teal-wash:#0E2830; --teal-line:#1B4450; --teal-text:#A8DCE8;
  --ok:#79D0A0; --ok-wash:#12251C; --ok-line:#2E5C44;
  --warn:#E9B872; --warn-wash:#241E14; --warn-line:#6B5530;
  --stop:#E08A8A; --stop-wash:#241416; --stop-line:#5A3434;
  --font-display:Newsreader,Georgia,"Times New Roman",serif;
  --font-eyebrow:Cinzel,Georgia,serif;
  --font-ui:Archivo,system-ui,-apple-system,sans-serif;
  --r-tag:2px; --r-control:4px; --r-card:8px; --r-modal:14px;
  --shadow-pop:0 24px 48px rgba(0,0,0,.6);
}
* { box-sizing:border-box; }
html, body { margin:0; background:var(--ink-950); color:var(--fg); font-family:var(--font-ui); -webkit-font-smoothing:antialiased; }
:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
.tabular { font-variant-numeric:tabular-nums; }
button, input, select { font:inherit; color:inherit; }
p { margin:0; }

/* ── Prototype stage: not part of the helper ─────────────────────── */
.stage { min-height:100vh; display:flex; gap:40px; align-items:flex-start; justify-content:center; padding:48px 24px; background:#2A2F38; }
.proto { width:280px; flex:none; background:#F4F1EA; color:#1D1F23; border-radius:8px; padding:16px; font:13px/1.45 system-ui,sans-serif; border:2px dashed #8C8576; }
.proto h2 { margin:0 0 4px; font:700 12px/1.2 system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
.proto p { margin:0 0 12px; color:#4B4D52; }
.proto label { display:block; font-weight:600; margin:10px 0 4px; }
.proto select { width:100%; min-height:40px; padding:6px 8px; border:1px solid #8C8576; border-radius:4px; background:#fff; color:#1D1F23; }
.proto .note { margin-top:12px; font-size:12px; color:#4B4D52; }
.desk { flex:none; }
.titlebar { width:420px; height:28px; background:#3A3F48; border-radius:10px 10px 0 0; display:flex; align-items:center; justify-content:center; color:#C9CDD4; font:12px system-ui,sans-serif; position:relative; }
.titlebar::before { content:""; position:absolute; left:12px; top:9px; width:10px; height:10px; border-radius:50%; background:#6B7079; box-shadow:16px 0 0 #6B7079, 32px 0 0 #6B7079; }
.desk-caption { width:420px; margin-top:10px; color:#C9CDD4; font:12px system-ui,sans-serif; text-align:center; }
@media (max-width:899px) {
  .stage { flex-direction:column; align-items:center; gap:16px; padding:12px; }
  .proto { width:100%; max-width:420px; }
  .desk { width:100%; display:flex; flex-direction:column; align-items:center; }
  .titlebar, .desk-caption { width:100%; max-width:420px; }
}
html.bare .stage { padding:0; display:block; background:var(--ink-950); min-height:0; }
html.bare .proto, html.bare .titlebar, html.bare .desk-caption { display:none; }

/* ── The helper window: fixed 420×640 content area ─────────────────── */
.win { width:420px; height:640px; overflow:hidden; background:var(--ink-950); display:flex; flex-direction:column; position:relative; }
.scaler { transform-origin:top left; }
.win-head { flex:none; height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 6px 0 16px; border-bottom:1px solid var(--line); background:var(--ink-900); }
.win-head .brand { display:flex; align-items:center; gap:10px; }
.win-head .brand img { height:22px; width:auto; display:block; }
.win-body { flex:1; min-height:0; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
.staging-band { flex:none; display:flex; align-items:center; justify-content:center; gap:8px; min-height:30px; padding:4px 12px; background:var(--warn-wash); border-bottom:1px solid var(--warn-line); color:var(--warn); font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }

/* Type roles */
.eyebrow { font-family:var(--font-eyebrow); font-size:11px; font-weight:600; letter-spacing:.28em; text-transform:uppercase; color:var(--sand); line-height:1.2; }
.title { font-family:var(--font-display); font-weight:500; font-size:26px; line-height:1.1; letter-spacing:-.01em; margin:0; }
.title-sm { font-family:var(--font-display); font-weight:500; font-size:20px; line-height:1.3; margin:0; }
.body { font-size:14px; line-height:1.55; color:var(--fg-2); }
.small { font-size:13px; line-height:1.55; color:var(--fg-2); }
.caption { font-size:12px; line-height:1.45; color:var(--fg-muted); }
.label-field { font-size:12px; font-weight:600; line-height:16px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-2); }
.th { font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--fg-muted); }
.mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; word-break:break-all; color:var(--fg-2); }

/* Button.tsx */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; height:44px; padding:0 22px; border-radius:var(--r-control); font-weight:600; font-size:14px; border:0; cursor:pointer; transition:filter 120ms; white-space:nowrap; text-decoration:none; }
.btn:hover { filter:brightness(1.1); }
.btn-primary { background:var(--sand); color:var(--ink-950); letter-spacing:.02em; }
.btn-secondary { background:transparent; border:1px solid var(--line-strong); color:var(--fg); }
.btn-ghost { background:transparent; color:var(--fg-2); }
.btn-danger { background:transparent; border:1px solid var(--stop-line); color:var(--stop); }
.btn-sm { padding:0 16px; font-size:13px; }
.btn-sm.btn-secondary { background:var(--ink-700); }
.btn[disabled] { cursor:not-allowed; background:var(--ink-700); color:var(--fg-3); border:0; filter:none; }
.btn.loading { opacity:.75; cursor:default; }
.btn.loading[disabled] { background:var(--sand); color:var(--ink-950); }
.btn-icon { width:44px; padding:0; }
.btn-block { width:100%; }
.spin { display:block; width:13px; height:13px; border-radius:50%; border:2px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.row { display:flex; gap:10px; align-items:center; }
.row-wrap { display:flex; gap:10px; flex-wrap:wrap; }
.stack { display:flex; flex-direction:column; gap:8px; }
.spacer { flex:1; }

/* TextLink.tsx */
.link { color:var(--teal); text-decoration:none; border-bottom:1px solid var(--teal-line); padding-bottom:2px; background:none; border-top:0; border-left:0; border-right:0; cursor:pointer; font-size:inherit; }
.link-row { display:inline-flex; align-items:center; min-height:44px; }
/* A link with a 44px hit area; underline drawn on the text, not the box edge. */
.link.link-row { border-bottom:0; padding-bottom:0; text-decoration:underline; text-decoration-color:var(--teal-line); text-underline-offset:4px; }

/* Field.tsx */
.field { display:flex; flex-direction:column; gap:8px; }
.input { width:100%; height:46px; padding:0 14px; border-radius:var(--r-control); border:1px solid var(--line-strong); background:var(--ink-700); font-size:15px; color:var(--fg); }
.input::placeholder { color:var(--fg-muted); }
.input[aria-invalid="true"] { border-color:var(--stop); background:var(--stop-wash); }
.note { font-size:12px; color:var(--fg-muted); }
.note.err { color:var(--stop); }

/* Choice.tsx card */
.choice { display:flex; align-items:center; gap:12px; min-height:46px; padding:8px 14px; border-radius:var(--r-control); border:1px solid var(--line-strong); background:var(--ink-700); font-size:15px; cursor:pointer; }
.choice:has(:checked) { border-color:var(--teal-dim); background:var(--teal-wash); }
.choice input { width:16px; height:16px; accent-color:var(--teal); flex:none; }
.choice .sub { display:block; font-size:12px; color:var(--fg-muted); margin-top:2px; word-break:break-all; }

/* Badges.tsx StatusPill / Tag */
.pill { display:inline-flex; align-items:center; gap:7px; border-radius:999px; border:1px solid; padding:5px 11px; font-size:12px; font-weight:600; white-space:nowrap; }
.pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.pill.ok { border-color:var(--ok-line); background:var(--ok-wash); color:var(--ok); }
.pill.warn { border-color:var(--warn-line); background:var(--warn-wash); color:var(--warn); }
.pill.stop { border-color:var(--stop-line); background:var(--stop-wash); color:var(--stop); }
.pill.closed { border-color:var(--line-strong); background:var(--ink-700); color:var(--fg-muted); }
.tag { display:inline-flex; align-items:center; border-radius:var(--r-tag); border:1px solid var(--line-strong); background:var(--ink-700); padding:5px 10px; font-size:12px; font-weight:600; color:var(--fg-2); }

/* Card.tsx */
.card { border-radius:var(--r-card); border:1px solid var(--line); background:var(--ink-850); padding:16px; }
.card.accolade { border-color:var(--sand-dim); }
.card.tone-warn { border-color:var(--warn-line); background:var(--warn-wash); }
.card.tone-stop { border-color:var(--stop-line); background:var(--stop-wash); }
.card.tone-info { border-color:var(--teal-line); background:var(--teal-wash); }

/* EmptyState.tsx */
.empty { display:flex; flex-direction:column; align-items:center; gap:10px; border:1px dashed var(--line-strong); background:var(--ink-850); border-radius:var(--r-card); padding:28px 20px; text-align:center; }
.empty img { width:30px; opacity:.28; }
.empty .t { font-weight:600; font-size:15px; }
.empty .d { max-width:280px; font-size:13px; color:var(--fg-2); }

/* Toggle.tsx */
.toggle { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.toggle label { min-height:44px; display:flex; align-items:center; font-size:14px; color:var(--fg-2); }
.switch { width:44px; height:44px; display:flex; align-items:center; background:none; border:0; padding:0; cursor:pointer; border-radius:var(--r-control); }
.switch .track { display:flex; align-items:center; width:44px; height:24px; border-radius:999px; padding:3px; border:1px solid var(--line-strong); background:var(--ink-700); justify-content:flex-start; }
.switch .knob { width:18px; height:18px; border-radius:50%; background:var(--fg-3); display:block; }
.switch[aria-checked="true"] .track { justify-content:flex-end; background:var(--teal-dim); border-color:var(--teal-dim); }
.switch[aria-checked="true"] .knob { background:var(--teal); }

/* Progress (ProgressTrack.tsx) */
.track-bar { height:6px; border-radius:999px; background:var(--ink-700); overflow:hidden; }
.track-bar > span { display:block; height:100%; background:var(--teal); border-radius:999px; }

/* Activity list (DataTable rhythm) */
.acts { list-style:none; margin:0; padding:0; }
.acts li { display:grid; grid-template-columns:72px 1fr; gap:10px; padding:9px 0; border-top:1px solid var(--line-faint); font-size:13px; line-height:1.45; }
.acts li:first-child { border-top:0; }
.acts time { color:var(--fg-muted); font-size:12px; padding-top:1px; }
.acts .what { color:var(--fg-2); min-width:0; overflow-wrap:anywhere; }
.acts .what b { color:var(--fg); font-weight:600; }
.acts .what .k { font-weight:600; }
.acts .k-ok { color:var(--ok); } .acts .k-warn { color:var(--warn); } .acts .k-stop { color:var(--stop); }
.acts .meta { color:var(--fg-muted); }

/* Section headings inside the window */
.sec-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.divider { border:0; border-top:1px solid var(--line); margin:0; }

/* Tabs */
.tabs { flex:none; display:flex; border-bottom:1px solid var(--line); background:var(--ink-900); padding:0 8px; }
.tabs button { flex:1; height:44px; background:none; border:0; border-bottom:2px solid transparent; color:var(--fg-2); font-size:14px; font-weight:500; cursor:pointer; }
.tabs button[aria-selected="true"] { color:var(--fg); border-bottom-color:var(--sand); }

/* ── System previews (tray, notification): drawn as the OS draws them ── */
.sys { padding:16px; display:flex; flex-direction:column; gap:14px; overflow-y:auto; flex:1; }
.sys-note { font-size:12px; color:var(--fg-muted); }
.menubar { display:flex; align-items:center; justify-content:flex-end; gap:14px; height:26px; padding:0 10px; border-radius:6px; font:13px system-ui,sans-serif; }
.menubar.dark { background:#1E1E1E; color:#EEE; }
.menubar.light { background:#E9E9EB; color:#222; }
.trayicon { position:relative; width:18px; height:18px; display:inline-block; }
.trayicon img { width:16px; height:18px; display:block; object-fit:contain; }
.menubar.light .trayicon img { filter:brightness(0); }
.trayicon .dot { position:absolute; top:-2px; right:-4px; width:8px; height:8px; border-radius:50%; border:1.5px solid; }
.menubar.dark .dot { border-color:#1E1E1E; } .menubar.light .dot { border-color:#E9E9EB; }
.dot.ok { background:#34C759; } .dot.warn { background:#FFB020; } .dot.stop { background:#FF453A; }
.osmenu { width:250px; background:#2B2B2D; color:#EEE; border:1px solid #4A4A4C; border-radius:8px; padding:5px; font:13px/1.2 system-ui,sans-serif; box-shadow:var(--shadow-pop); }
.osmenu div { padding:5px 10px; border-radius:4px; }
.osmenu .dis { color:#8C8C90; }
.osmenu .sel { background:#2F63D6; color:#fff; }
.osmenu hr { border:0; border-top:1px solid #47474A; margin:5px 8px; }
.toast-os { width:350px; background:#2B2B2D; color:#EEE; border:1px solid #4A4A4C; border-radius:14px; padding:8px 12px; display:flex; gap:10px; font:13px/1.35 system-ui,sans-serif; box-shadow:var(--shadow-pop); }
.toast-os img { width:36px; height:36px; border-radius:8px; flex:none; }
.toast-os b { display:block; font-weight:600; margin-bottom:2px; }
.toast-os .app { color:#9A9AA0; font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:1px; }
</style>

// Activity: newest first. Times count back from 11:58 PM in 3–8 minute steps.
function clock(minsBefore) {
  let m = 23 * 60 + 58 - minsBefore; const h24 = Math.floor(m / 60), mm = m % 60;
  const fmt = h => `${((h + 11) % 12) + 1}:${String(mm).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`;
  return [fmt(h24), fmt(h24 - 2)];
}

}

/* Stage: prototype controls beside the real-size window. */
function boot(versionName, versionNote, render) {
  const q = new URLSearchParams(location.search);
  const state = STATES[q.get('state')] ? q.get('state') : 'ready';
  const theme = 'default';
  if (q.get('bare') === '1') document.documentElement.classList.add('bare');
  const opts = Object.keys(STATES).map(s => `<option value="${s}" ${s === state ? 'selected' : ''}>${s}</option>`).join('');
  document.body.innerHTML = `<div class="stage">
    <aside class="proto" aria-label="Prototype controls">
      <h2>Prototype controls</h2><p>Not part of the helper. Version ${esc(versionName)}: ${esc(versionNote)}</p>
      <label for="pick-state">State</label><select id="pick-state">${opts}</select>
      <label for="pick-theme">Theme</label><select id="pick-theme"><option value="default" selected>default (dark only)</option></select>
      <p class="note">The window is the real size, 420×640. The grey bar above it stands in for the system title bar.</p>
    </aside>
    <div class="desk"><div class="titlebar" aria-hidden="true">Bureaucracy Forever Helper</div><div class="scaler"><div class="win" id="win"></div></div><p class="desk-caption">Window: 420×640, fixed</p></div>
  </div>`;
  document.getElementById('win').innerHTML = render(STATES[state], state);
  const fit = () => { const s = document.querySelector('.scaler'); const k = document.documentElement.classList.contains('bare') ? 1 : Math.min(1, (innerWidth - 24) / 420); s.style.transform = k < 1 && !document.documentElement.classList.contains('bare') ? `scale(${k})` : ''; s.style.height = k < 1 ? `${640 * k}px` : ''; s.style.width = k < 1 ? `${420 * k}px` : ''; };
  fit(); addEventListener('resize', fit);
  document.getElementById('pick-state').addEventListener('change', e => { q.set('state', e.target.value); q.set('theme', theme); location.search = q.toString(); });
  document.documentElement.dataset.state = state;
  document.documentElement.dataset.theme = theme;
}

/* Version B, "Chain": the five links from site to awards, each with its state; the broken link opens to say what's wrong. Setup fills the chain in. Activity is a short list with "See all". */
const LINKS = {
  site: { name: 'Guild site', ok: ['ok', 'Connected', 'Connected as Aldric'], offline: ['stop', 'Offline', 'Can’t reach the guild site'], revoked: ['stop', 'Key refused', 'The site refused this key'], off: ['stop', 'Switched off', 'The site isn’t accepting the helper'] },
  folder: { name: 'Game folder', ok: ['ok', 'Found', '…/World of Warcraft/_classic_'] },
  addon: { name: 'Add-on', ok: ['ok', 'Installed', 'Version 1.3.2'], update: ['warn', 'Update ready', 'Version 1.4.0 is ready'], installing: ['closed', 'Installing', 'Installing 1.4.0'], updated: ['ok', 'Updated', 'Version 1.4.0'], 'rolled-back': ['warn', 'Not updated', 'Still on 1.3.2'] },
  reserves: { name: 'Reserves', ok: ['ok', 'In the game', 'Next 12 hours'], reload: ['warn', '/reload needed', 'Molten Core changed'], none: ['closed', 'No raids soon', 'None in the next 12 hours'] },
  awards: { name: 'Awards', idle: ['closed', 'None yet', 'They send as they’re handed out'], ok: ['ok', 'Sending', 'Going to Molten Core'], waiting: ['stop', 'Waiting', 'Kept until they can send'], refused: ['warn', '1 refused', 'Others still sending'], damaged: ['stop', 'Stopped', 'Waiting list damaged'], chosen: ['closed', 'None yet', 'Going to Molten Core'], 'not-loaded': ['warn', 'Not loaded', 'Raid not loaded'], 'not-chosen': ['warn', 'Not chosen', 'Raid not chosen yet'], off: ['closed', 'Off', 'Not a guild run'] },
};
const ORDER = ['site', 'folder', 'addon', 'reserves', 'awards'];
const linkRow = (id, [tone, word, detail], open = '', current = false, extra = '') => `<li class="${open ? 'open' : ''}" style="padding:12px 14px;border-top:1px solid var(--line);${open ? `background:var(--${tone === 'ok' || tone === 'closed' ? 'ink-800' : tone + '-wash'})` : ''}" ${current ? 'aria-current="step"' : ''}>
  <div class="row" style="min-height:24px"><span style="font-weight:600;font-size:14px;width:96px;flex:none">${LINKS[id].name}</span><span class="caption" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${detail}</span><span class="pill ${tone}">${word}</span></div>
  ${extra}${open ? `<div class="stack" style="margin-top:12px">${open}</div>` : ''}</li>`;
const chainList = rows => `<ol class="chain" style="flex:none;list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r-card);background:var(--ink-850);overflow:hidden">${rows.join('')}</ol>`;

// Lines under a row: each raid's start time, and where to change the raid awards go to.
const sub = html => `<div style="margin:4px 0 0 96px">${html}</div>`;
function under(id, st, s) {
  if (id === 'reserves' && s.raids.length) return sub(s.raids.map(r => `<div class="row" style="min-height:20px"><span class="caption" style="color:var(--fg-2)">${esc(r.name)}</span><span class="spacer"></span><span class="caption tabular">${raidWhen(r)}</span></div>`).join(''));
  if (id === 'awards' && s.choice && (s.choice.by !== 'chosen' || !s.going || s.going === s.choice.raid)) return sub(`<p class="caption">${choiceLine(s.choice)}</p>`);
  if (id === 'awards' && s.going) return sub(`<p class="caption">Picked in game. Change it on the add-on’s Sync tab.</p>`);
  return '';
}
function render(s, slug) {
  if (s.kind === 'setup') {
    const keyStep = s.step === 'key';
    const rows = [
      linkRow('site', keyStep ? ['closed', 'Step 1', 'Paste your helper key'] : LINKS.site.ok, keyStep ? `${keyField(s.key)}${keyButtons(s.key)}` : '', keyStep),
      linkRow('folder', keyStep ? ['closed', 'Step 2', 'Found after the key'] : ['closed', 'Step 2', s.folder.phase === 'searching' ? 'Looking for the game' : 'Choose the game folder'], keyStep ? '' : folderBody(s.folder), !keyStep),
      linkRow('addon', ['closed', 'Next', 'Checked with the folder']),
      linkRow('reserves', ['closed', 'Next', 'Ready once you’re connected']),
      linkRow('awards', ['closed', 'Next', 'Sent during the raid']),
    ];
    return `${head()}<main class="win-body"><h1 class="title-sm">Connect the helper</h1><p class="small" style="margin-top:-8px">Two steps, once. After that the helper runs by itself.</p>${chainList(rows).replace('border-top:1px solid var(--line);', '')}</main>`;
  }
  if (s.kind === 'settings') return `${head(back('Done'))}<main class="win-body" style="gap:16px"><h1 class="title-sm">Settings</h1>${settingsBody(false)}</main>`;
  if (s.kind === 'tray') return `${head(gear())}${trayPreview()}`;
  if (s.kind === 'notification') return `${head(gear())}${notificationPreview()}`;
  if (s.activityView) return `${head(back('Status'))}<main class="win-body" style="gap:6px"><div class="sec-head"><h1 class="title-sm">Activity</h1><span class="caption tabular">${s.sent} sent tonight</span></div><p class="caption">Today, newest first, CDT. The last 50 are kept.</p>${actList(s.list)}</main>`;

  // The first link that isn't fine opens with the status message and its action.
  const states = ORDER.map(id => [id, s.chain[id]]);
  const broken = states.find(([, st]) => !['ok', 'idle', 'none', 'updated', 'chosen', 'not-loaded', 'not-chosen', 'off'].includes(st));
  const msg = `<p class="small" style="color:var(--fg)">${esc(s.status.body)}</p>${s.status.action ? `<div class="row"><button class="btn btn-${s.status.action.kind} btn-sm" type="button">${s.status.action.label}</button></div>` : ''}`;
  const rows = states.map(([id, st]) => {
    let open = '';
    if (s.update && ((s.update.who === 'addon' && id === 'addon'))) open = updateCard(s.update).replace(/class="card tone-\w+ stack /, 'class="stack ').replace(/<p style="font-weight:600;font-size:15px">[^<]*<\/p>/, '');
    else if (broken && broken[0] === id) open = msg;
    return linkRow(id, LINKS[id][st], open, false, under(id, st, s));
  });
  const allGood = !broken && !s.update;
  const top = `<div class="row" style="gap:12px" aria-live="polite"><h1 class="title-sm" style="flex:1">${allGood ? (s.chain.awards === 'ok' ? 'Everything’s working' : esc(s.status.title)) : esc(s.status.title)}</h1><span class="pill ${s.status.tone}">${s.status.word}</span></div>`;
  const helperUpd = s.update && s.update.who === 'helper' ? updateCard(s.update) : '';
  const recent = s.list.slice(0, 3);
  return `${stagingBand(s.staging)}${head(gear())}
  <main class="win-body">
    ${top}
    ${s.chain.reserves === 'none' ? '' : ''}
    ${chainList(rows).replace('border-top:1px solid var(--line);', '')}
    ${helperUpd}
    <section class="stack" style="gap:2px"><div class="sec-head"><h2 class="th" style="margin:0">Recent activity</h2><span class="caption">CDT</span><span class="spacer"></span>${s.list.length > 3 ? `<button class="link link-row small" type="button">See all ${s.list.length}</button>` : ''}</div>${actList(recent)}</section>
  </main>`;
}
boot('A', 'how the raid was chosen sits under the Awards row.', render);
</script>
</body></html>
