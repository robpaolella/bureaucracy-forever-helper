[package]
name = "bureaucracy-forever-helper"
version = "0.1.0"
description = "Bureaucracy Forever Helper"
edition = "2021"

[lib]
name = "bureaucracy_forever_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
keyring-core = "1"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[dev-dependencies]
base64 = "0.22"
minisign = "0.10"
tauri = { version = "2", features = ["tray-icon", "test"] }
